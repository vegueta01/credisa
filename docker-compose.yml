services:
  web:
    build: .
    image: creditos-sm-perfumes:latest
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: ./api
    image: creditos-sm-perfumes-api:latest
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Define ADMIN_TOKEN in .env (ver .env.example)}
    volumes:
      - stock-data:/data

volumes:
  stock-data:
